<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340">
<defs>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6FAE"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF0F7"/><stop offset="1" stop-color="#F0EDFF"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/></filter>
</defs>
<rect width="1080" height="2340" rx="48" fill="#F8F7FC"/>
<rect x="0" y="0" width="1080" height="150" fill="white" opacity=".9"/>
<text x="70" y="92" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#25233A">Welcome to Bunny</text>

<circle cx="540" cy="610" r="250" fill="url(#soft)" filter="url(#shadow)"/>
<text x="540" y="665" font-family="Arial, sans-serif" font-size="150" font-weight="400" fill="#25233A" text-anchor="middle">🐰</text>
<text x="540" y="1030" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#25233A" text-anchor="middle">Talk. Connect. Belong.</text>
<text x="540" y="1095" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#77748A" text-anchor="middle">A simple, private and beautiful place</text>
<text x="540" y="1140" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#77748A" text-anchor="middle">to chat with people you care about.</text>
<rect x="110" y="1300" width="860" height="115" rx="58" fill="url(#pink)"/>
<text x="540" y="1373" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="white" text-anchor="middle">Create account</text>
<rect x="110" y="1445" width="860" height="115" rx="58" fill="white" stroke="#E7E4EF" stroke-width="3"/>
<text x="540" y="1518" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#4B4660" text-anchor="middle">Log in</text>
<text x="540" y="1690" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#9692A6" text-anchor="middle">By continuing, you agree to Bunny's Terms &amp; Privacy.</text>

<rect x="0" y="2250" width="1080" height="90" fill="white"/>
<text x="70" y="2305" font-family="Arial" font-size="28" fill="#A4A1B4">Bunny</text>
<circle cx="1010" cy="2290" r="14" fill="#FF6FAE"/>
</svg>
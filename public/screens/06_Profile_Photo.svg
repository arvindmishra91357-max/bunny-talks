<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340">
<defs>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6FAE"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF0F7"/><stop offset="1" stop-color="#F0EDFF"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/></filter>
</defs>
<rect width="1080" height="2340" rx="48" fill="#F8F7FC"/>
<rect x="0" y="0" width="1080" height="150" fill="white" opacity=".9"/>
<text x="70" y="92" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#25233A">Add profile photo</text>

<circle cx="540" cy="680" r="220" fill="url(#soft)" stroke="#FFFFFF" stroke-width="12" filter="url(#shadow)"/>
<text x="540" y="735" font-family="Arial, sans-serif" font-size="130" font-weight="400" fill="#6F6A82" text-anchor="middle">🐰</text>
<circle cx="700" cy="830" r="62" fill="#FF6FAE" stroke="white" stroke-width="10"/>
<text x="700" y="848" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle">+</text>
<text x="540" y="1040" font-family="Arial, sans-serif" font-size="50" font-weight="800" fill=" #25233A" text-anchor="middle">Make it yours</text>
<text x="540" y="1100" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#77748A" text-anchor="middle">Add a profile picture so friends</text>
<text x="540" y="1145" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#77748A" text-anchor="middle">can recognize you.</text>
<rect x="100" y="1280" width="880" height="115" rx="58" fill="url(#pink)"/>
<text x="540" y="1353" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="white" text-anchor="middle">Upload photo</text>
<rect x="100" y="1425" width="880" height="105" rx="52" fill="white" stroke="#E5E2EC" stroke-width="3"/>
<text x="540" y="1490" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#5B566D" text-anchor="middle">Skip for now</text>

<rect x="0" y="2250" width="1080" height="90" fill="white"/>
<text x="70" y="2305" font-family="Arial" font-size="28" fill="#A4A1B4">Bunny</text>
